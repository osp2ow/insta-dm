name: 발송 진단
on:
  workflow_dispatch:
    inputs:
      script: { description: "실행할 스크립트", default: "diag.js" }
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: NODE_PATH=functions/node_modules node tools/${{ inputs.script || 'diag.js' }}

      - name: 결과를 임시 브랜치로
        if: always()
        run: |
          [ -d out ] || exit 0
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan diag-out; git rm -rqf --cached .; git add -f out; git commit -qm diag; git push -qf origin diag-out
